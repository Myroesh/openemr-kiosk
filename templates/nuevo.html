<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Paciente nuevo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <h1>Paciente nuevo</h1>
        <p>Complete los datos básicos.</p>
      </div>

      {% if errors %}
        <div class="alert">
          {% for error in errors %}
            <div>{{ error }}</div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="post" action="/nuevo" class="form">
        <label>Nombre</label>
        <input name="nombres" type="text" required value="{{ form.nombres or '' }}">

        <label>Apellido</label>
        <input name="apellidos" type="text" required value="{{ form.apellidos or '' }}">

        <label>Fecha de nacimiento</label>
        <input
          id="fecha_nacimiento"
          name="fecha_nacimiento"
          type="date"
          required
          value="{{ form.fecha_nacimiento or '' }}"
        >

        <input
          id="es_menor"
          name="es_menor"
          type="hidden"
          value="{{ 1 if form.es_menor else 0 }}"
        >

        <div id="minor_status" class="readonly-field" style="display: none;"></div>

        <label>Sexo</label>
        <select name="sexo" required>
          <option value="">Seleccione una opción</option>
          <option value="Male" {% if form.sexo == "Male" %}selected{% endif %}>Masculino</option>
          <option value="Female" {% if form.sexo == "Female" %}selected{% endif %}>Femenino</option>
          <option value="Other" {% if form.sexo == "Other" %}selected{% endif %}>Otro</option>
        </select>

        <label>CI / documento <span class="optional">(opcional)</span></label>
        <input name="ci_documento" type="text" inputmode="numeric" value="{{ form.ci_documento or '' }}">

        <label>Celular</label>
        <input name="telefono" type="tel" required value="{{ form.telefono or '' }}">

        <label>Dirección</label>
        <input name="direccion" type="text" value="{{ form.direccion or '' }}">

        <label>Tipo de visita</label>
        <input type="hidden" name="motivo_consulta" value="Consulta Inicial">
        <div class="readonly-field">Consulta Inicial</div>

        <label>Profesional</label>
        <select name="profesional_area">
          <option value="">Seleccione un profesional</option>
          {% for professional in professionals %}
            <option value="{{ professional }}" {% if form.profesional_area == professional %}selected{% endif %}>
              {{ professional }}
            </option>
          {% endfor %}
        </select>

        <div id="guardian_section" style="display: none;">
          <div class="section-subtitle">
            Datos de padre, madre o tutor
          </div>

          <p class="optional">
            Para pacientes menores de edad, registre al menos el nombre del padre o de la madre.
          </p>

          <div class="section-subtitle">Datos del padre</div>

          <label>Nombre del padre <span class="optional">(obligatorio si no registra madre)</span></label>
          <input name="padre_nombre" type="text" value="{{ form.padre_nombre or '' }}">

          <label>CI del padre <span class="optional">(opcional)</span></label>
          <input name="padre_ci" type="text" inputmode="numeric" value="{{ form.padre_ci or '' }}">

          <label>Teléfono del padre <span class="optional">(opcional)</span></label>
          <input name="padre_telefono" type="tel" value="{{ form.padre_telefono or '' }}">

          <div class="section-subtitle">Datos de la madre</div>

          <label>Nombre de la madre <span class="optional">(obligatorio si no registra padre)</span></label>
          <input name="madre_nombre" type="text" value="{{ form.madre_nombre or '' }}">

          <label>CI de la madre <span class="optional">(opcional)</span></label>
          <input name="madre_ci" type="text" inputmode="numeric" value="{{ form.madre_ci or '' }}">

          <label>Teléfono de la madre <span class="optional">(opcional)</span></label>
          <input name="madre_telefono" type="tel" value="{{ form.madre_telefono or '' }}">
        </div>

        <div class="actions">
          <button class="btn" type="submit">Continuar</button>
          <a class="btn btn-secondary" href="/">Volver</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    function calculateAgeFromDateString(dateString) {
      if (!dateString) {
        return null;
      }

      const birthDate = new Date(dateString + "T00:00:00");
      const today = new Date();

      if (Number.isNaN(birthDate.getTime())) {
        return null;
      }

      let age = today.getFullYear() - birthDate.getFullYear();
      const monthDiff = today.getMonth() - birthDate.getMonth();
      const dayDiff = today.getDate() - birthDate.getDate();

      if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
        age -= 1;
      }

      return age;
    }

    function updateMinorSection() {
      const birthDateInput = document.getElementById("fecha_nacimiento");
      const minorInput = document.getElementById("es_menor");
      const minorStatus = document.getElementById("minor_status");
      const guardianSection = document.getElementById("guardian_section");

      const age = calculateAgeFromDateString(birthDateInput.value);

      if (age === null || age < 0) {
        minorInput.value = "0";
        guardianSection.style.display = "none";
        minorStatus.style.display = "none";
        minorStatus.textContent = "";
        return;
      }

      if (age < 18) {
        minorInput.value = "1";
        guardianSection.style.display = "block";
        minorStatus.style.display = "block";
        minorStatus.textContent = "Paciente menor de edad. Debe registrar al menos padre o madre.";
      } else {
        minorInput.value = "0";
        guardianSection.style.display = "none";
        minorStatus.style.display = "block";
        minorStatus.textContent = "Paciente mayor de edad.";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const birthDateInput = document.getElementById("fecha_nacimiento");

      birthDateInput.addEventListener("change", updateMinorSection);
      birthDateInput.addEventListener("input", updateMinorSection);

      updateMinorSection();
    });
  </script>
</body>
</html>
